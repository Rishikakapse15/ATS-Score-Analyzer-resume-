<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>ATS Resume Analyzer Pro</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<h1>ATS Resume Analyzer Pro</h1>

<input type="file" id="resumeUpload">

<textarea id="jobDesc" placeholder="Paste Job Description"></textarea>

<button onclick="analyzeResume()">Analyze Resume</button>

<div class="results">

<h2>ATS Score: <span id="score">0</span>/100</h2>

<h3>Keyword Match</h3>
<div id="keywordResult"></div>

<h3>Missing Skills</h3>
<div id="skillGap"></div>

<h3>Resume Sections</h3>
<div id="sections"></div>

<h3>Bullet Quality</h3>
<div id="bullets"></div>

<h3>ATS Warnings</h3>
<div id="warnings"></div>

<h3>AI Resume Mentor</h3>
<div id="mentor"></div>

</div>

<h2>Progress Tracker</h2>
<canvas id="scoreChart"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
